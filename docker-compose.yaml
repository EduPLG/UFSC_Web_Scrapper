services:
  mongo:
    image: mongo:7
    container_name: imoveis_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: imoveis
      MONGO_INITDB_ROOT_PASSWORD: imoveis
      MONGO_INITDB_DATABASE: imoveis_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - mongo
  scraper:
    build: .
    container_name: imoveis_scraper
    depends_on:
      - mongo
      - metabase
    volumes:
      - .:/app
    command: python main.py
    stdin_open: true
    tty: true

volumes:
  mongo_data:
  metabase_data:
